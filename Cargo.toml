[workspace]
members = ["crates/contracts", "crates/catalog"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
minisign-verify = "=0.2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
