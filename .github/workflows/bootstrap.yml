name: Bootstrap verification
on:
  push:
    branches: [feat/verifier-foundation]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare independent signature fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 scripts/generate-fixtures.py
      - name: Resolve candidate dependency lock
        run: cargo generate-lockfile
      - name: Test contracts
        run: cargo test -p eng-contracts --locked
      - name: Test bundle integrity
        run: cargo test -p eng-catalog --test integrity --locked
      - name: Test authorization
        run: cargo test -p eng-catalog --test authorization --locked
      - name: Test CLI
        if: always()
        run: cargo test -p engctl --locked
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test and build web interface
        run: npm ci --ignore-scripts && npm test && npm run build
      - name: Format candidate
        if: always()
        run: cargo fmt --all
      - name: Preserve dependency lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-build-inputs
          path: |
            Cargo.lock
            crates
            apps/engctl
          if-no-files-found: error
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Resolve Nix lock and test build
        run: |
          nix flake lock
          nix develop --command cargo generate-lockfile
          nix flake check --print-build-logs
      - name: Preserve Nix lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-nix-lock
          path: |
            flake.lock
            Cargo.lock
          if-no-files-found: error
